[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Text2Meta"
version = "0.1.0"
description = "Framework for extracting textual meta-features"
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "Fernando Rezende Zagatti" }
]

# DEPENDÊNCIAS
# ORDEM PRESERVADA EXATAMENTE COMO NO DOCKERFILE
dependencies = [
    "pandas==2.2.2",
    "scikit-learn==1.4.2",
    "scipy==1.10.1",
    "nltk==3.8.1", 
    "textstat==0.7.10", 
]

[tool.setuptools.packages.find]
where = ["."]
